<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Dark Developer Toolbox</title>
    <link rel="stylesheet" href="instagram.css">
</head>
<body>
    <main class="container">
        <button id="backButton" class="back-button" type="button">
            ‹ Voltar
        </button>
        <header>
            <h1>Instagram</h1>
            <p>
                Ferramentas disponíveis
            </p>
        </header>

        <section class="tools">
            <button id="sessionTool" class="tool-card" type="button">
                <div class="tool-content">
                    <strong>
                        Sessão e autenticação
                    </strong>
                    <span>
                        Visualizar e copiar os dados da sessão ativa
                    </span>
                </div>
                <span class="arrow">
                    ›
                </span>
            </button>
            <button id="followersTool" class="tool-card" type="button">
                <div class="tool-content">
                    <strong>
                        Followers
                    </strong>
                    <span>
                        Consultar seguidores de um perfil
                    </span>
                </div>
                <span class="arrow">
                    ›
                </span>
            </button>
            
            <button id="followingTool" class="tool-card" type="button">
                <div class="tool-content">
                    <strong>
                        Following
                    </strong>
                    <span>
                        Consultar perfis seguidos
                    </span>
                </div>
                <span class="arrow">
                    ›
                </span>
            </button>
        </section>
    </main>
    <script src="instagram.js"></script>
</body>
</html>
