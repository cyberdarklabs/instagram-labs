<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followers - Instagram</title>
    <link rel="stylesheet" href="followers.css">
</head>
<body>
    <main class="container">
        <button id="backButton" class="back-button" type="button">
            ‹ Voltar
        </button>

        <header>
            <h1>Followers</h1>
            <p>
                Consultar seguidores de um perfil
            </p>
        </header>

        <section class="step">
            <div class="step-header">
                <span class="step-number">1</span>

                <div>
                    <strong>
                        Identificar perfil
                    </strong>

                    <p>
                        Informe a URL do perfil para localizar o User ID.
                    </p>
                </div>
            </div>

            <div class="field">
                <label for="profileUrl">
                    URL do perfil
                </label>

                <input
                    id="profileUrl"
                    type="text"
                    placeholder="https://www.instagram.com/usuario/"
                >
            </div>

            <button id="discoverButton" class="secondary-button" type="button">
                Descobrir ID
            </button>

            <div class="field">
                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    readonly
                >
            </div>

            <div class="field">
                <label for="userId">
                    User ID
                </label>

                <input
                    id="userId"
                    type="text"
                    readonly
                >
            </div>
        </section>

        <section id="requestStep" class="step disabled-step">
            <div class="step-header">
                <span class="step-number">2</span>

                <div>
                    <strong>
                        Consultar followers
                    </strong>

                    <p>
                        A requisição será montada automaticamente.
                    </p>
                </div>
            </div>

            <div class="field">
                <label for="apiUrl">
                    URL da API
                </label>

                <textarea
                    id="apiUrl"
                    class="request-url"
                    readonly
                ></textarea>
            </div>

            <div class="field">
                <label for="headers">
                    Headers
                </label>

                <textarea
                    id="headers"
                    readonly
                ></textarea>
            </div>

            <button id="executeButton" class="primary-button" type="button" disabled>
                Buscar followers
            </button>
        </section>

        <section id="requestStatus" class="status-card hidden">
            <span id="statusDot" class="status-dot"></span>

            <div>
                <strong id="statusTitle">
                    Status
                </strong>

                <p id="statusMessage"></p>
            </div>
        </section>

        <section id="summary" class="summary hidden">
            <div class="summary-item">
                <span>Status HTTP</span>
                <strong id="httpStatus">-</strong>
            </div>

            <div class="summary-item">
                <span>Usuários</span>
                <strong id="usersCount">0</strong>
            </div>

            <div class="summary-item">
                <span>Has more</span>
                <strong id="hasMore">-</strong>
            </div>

            <div class="summary-item">
                <span>Next max ID</span>
                <strong id="nextMaxId">-</strong>
            </div>
        </section>

        <section id="usersSection" class="users-section hidden">
            <h2>Seguidores</h2>

            <div id="usersList" class="users-list"></div>
        </section>

        <section id="rawSection" class="raw-section hidden">
            <button id="toggleRawButton" class="secondary-button" type="button">
                Ver resposta JSON
            </button>

            <pre id="rawResponse" class="raw-response hidden"></pre>
        </section>
    </main>

    <script src="followers.js"></script>
</body>
</html>
