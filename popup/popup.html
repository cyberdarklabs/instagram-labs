<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douglas DevTools</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>
                Douglas DevTools
            </h1>
            <p>
                Developer Toolbox
            </p>
        </header>

        <section class="tools">

            <button id="instagramTool" class="tool" type="button">
                <div class="tool-icon">
                    IG
                </div>
                <div class="tool-info">
                    <strong>
                        Instagram
                    </strong>
                    <span>
                        Sessão e autenticação
                    </span>
                </div>
                <div class="tool-arrow">
                    ›
                </div>
            </button>
        </section>
        <footer>
            Douglas DevTools v0.1.0
        </footer>
    </main>
    <script src="popup.js"></script>
</body>
</html>
